<title>Jardín para Fernanda</title>
<style>
  :root{
    --noche-1:#181026;
    --noche-2:#2c1a3f;
    --ocaso-1:#5b2f6b;
    --ocaso-2:#c1552e;
    --ocaso-3:#f0a13c;
    --girasol:#ffc93c;
    --girasol-deep:#f2971d;
    --girasol-light:#ffe08a;
    --centro:#6b3714;
    --centro-light:#8a4a1c;
    --hoja:#4f7a3a;
    --hoja-deep:#375a28;
    --crema:#fff6e2;
    --crema-dim:#f2e6c8;
    --cinta:#7a2e2f;
    --cinta-deep:#5c2022;
    --tinta:#2a1a12;
    --font-display:'Fraunces',ui-serif,Georgia,serif;
    --font-body:'Figtree',ui-sans-serif,system-ui,sans-serif;
    --font-hand:'Caveat',cursive;
  }

  html,body{height:100%;}
  body{
    margin:0;
    background:var(--noche-1);
    color:var(--crema);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  .scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    isolation:isolate;
  }

  .sky{
    position:absolute;
    inset:0;
    z-index:0;
  }
  .sky-night{
    background:
      radial-gradient(120% 60% at 78% 8%, rgba(255,246,226,0.06), transparent 60%),
      linear-gradient(180deg, var(--noche-1) 0%, var(--noche-2) 55%, #3a2245 100%);
    opacity:1;
    transition:opacity 1.6s ease;
  }
  .sky-day{
    background:
      linear-gradient(180deg, var(--ocaso-1) 0%, var(--ocaso-2) 55%, var(--ocaso-3) 100%);
    opacity:0;
    transition:opacity 1.6s ease;
  }
  .scene.opening .sky-night{opacity:0;}
  .scene.opening .sky-day{opacity:1;}

  #petal-canvas{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
  }

  .moon{
    position:absolute;
    top:9%;
    right:14%;
    width:clamp(46px,9vw,84px);
    height:clamp(46px,9vw,84px);
    border-radius:50%;
    background:radial-gradient(circle at 34% 32%, #fffaf0, var(--crema-dim) 55%, #e8dcae 100%);
    box-shadow:0 0 40px rgba(255,246,226,0.35), 0 0 90px rgba(255,246,226,0.15);
    z-index:1;
    transition:opacity 1.2s ease, transform 1.2s ease;
  }
  .scene.opening .moon{opacity:0;transform:translateY(-30px);}

  .stars{position:absolute;inset:0;z-index:1;transition:opacity 1.2s ease;}
  .scene.opening .stars{opacity:0;}
  .star{
    position:absolute;
    width:2px;height:2px;
    background:var(--crema);
    border-radius:50%;
    animation:twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:1;}}

  .fireflies{position:absolute;inset:0;z-index:2;pointer-events:none;}
  .firefly{
    position:absolute;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--girasol-light);
    box-shadow:0 0 8px 2px rgba(255,224,138,0.8);
    opacity:0;
    animation:drift 9s ease-in-out infinite, glow 2.6s ease-in-out infinite;
  }
  @keyframes drift{
    0%{transform:translate(0,0);}
    25%{transform:translate(var(--dx1),var(--dy1));}
    50%{transform:translate(var(--dx2),var(--dy2));}
    75%{transform:translate(var(--dx3),var(--dy3));}
    100%{transform:translate(0,0);}
  }
  @keyframes glow{0%,100%{opacity:0;}50%{opacity:.9;}}

  .hero{
    position:relative;
    z-index:5;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px 20px;
    gap:18px;
    transition:opacity .7s ease, transform .7s ease;
  }
  .scene.opening .hero{opacity:0;transform:translateY(-16px) scale(.98);pointer-events:none;}

  .eyebrow{
    margin:0;
    font-size:.78rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--girasol-light);
    font-weight:600;
  }
  .title{
    margin:0;
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(2.4rem,9vw,4.6rem);
    line-height:1.05;
    color:var(--crema);
    text-wrap:balance;
  }
  .title .name{
    font-style:italic;
    font-weight:500;
    color:var(--girasol);
  }
  .lede{
    margin:0;
    max-width:38ch;
    font-size:clamp(.95rem,2.6vw,1.1rem);
    line-height:1.55;
    color:var(--crema-dim);
  }

  .open-btn{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:none;
    border-radius:999px;
    padding:16px 30px;
    font-family:var(--font-body);
    font-size:1rem;
    font-weight:700;
    color:var(--tinta);
    background:linear-gradient(135deg, var(--girasol-light), var(--girasol) 60%, var(--girasol-deep));
    box-shadow:0 10px 30px rgba(242,151,29,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .open-btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 36px rgba(242,151,29,0.45);}
  .open-btn:active{transform:translateY(0) scale(.98);}
  .open-btn:focus-visible{outline:3px solid var(--crema);outline-offset:3px;}
  .open-btn svg{width:20px;height:20px;}

  .replay-btn{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%,140%);
    z-index:60;
    border:1px solid rgba(255,246,226,0.4);
    border-radius:999px;
    padding:10px 20px;
    background:rgba(24,16,38,0.55);
    backdrop-filter:blur(6px);
    color:var(--crema);
    font-family:var(--font-body);
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .6s cubic-bezier(.22,1,.36,1), opacity .6s ease;
    opacity:0;
  }
  .replay-btn.show{
    transform:translate(-50%,0);
    opacity:1;
  }

  .ground{
    position:absolute;
    left:0;right:0;bottom:0;
    height:46%;
    z-index:4;
    transform:translateY(102%);
    transition:transform 1.3s cubic-bezier(.22,1,.36,1);
  }
  .scene.opening .ground{transform:translateY(0);}

  .hills{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .flowerbed{
    position:absolute;
    left:0;right:0;bottom:6%;
    height:78%;
  }

  .flower{
    position:absolute;
    bottom:0;
    width:14%;
    max-width:120px;
    min-width:56px;
    transform-origin:bottom center;
    transition:left .95s cubic-bezier(.22,1,.36,1), transform .95s cubic-bezier(.22,1,.36,1);
  }
  .flower.gather{
    left:50% !important;
    transform:translateX(calc(-50% + var(--fan,0px))) rotate(var(--frot,0deg)) scale(var(--fscale,.6));
  }
  .flower-svg{width:100%;height:auto;display:block;overflow:visible;}
  .stem{
    fill:none;
    stroke:var(--hoja-deep);
    stroke-width:3.4;
    stroke-linecap:round;
    transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1);
  }
  .leaf{fill:var(--hoja);opacity:0;transform:scale(0);transform-origin:center;transition:opacity .6s ease .3s, transform .6s cubic-bezier(.22,1,.36,1) .3s;}
  .flower.grow .leaf{opacity:1;transform:scale(1);}
  .head{opacity:0;transform:scale(0) rotate(-20deg);transform-origin:center;}
  .flower.bloomed .head{
    animation:bloom .75s cubic-bezier(.22,1.4,.36,1) forwards;
  }
  .flower.sway .head{animation-name:bloom, sway;animation-duration:.75s, var(--swaydur,4.2s);animation-timing-function:cubic-bezier(.22,1.4,.36,1), ease-in-out;animation-iteration-count:1, infinite;animation-fill-mode:forwards, none;animation-delay:0s, .75s;}
  @keyframes bloom{
    0%{opacity:0;transform:scale(0) rotate(-20deg);}
    65%{opacity:1;transform:scale(1.08) rotate(4deg);}
    100%{opacity:1;transform:scale(1) rotate(0deg);}
  }
  @keyframes sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  .petal{transition:filter .3s ease;}
  .flower.gather .head{animation-play-state:paused;}

  .bow{
    position:absolute;
    left:50%;
    bottom:4%;
    width:64px;
    transform:translate(-50%,20px) scale(.4);
    opacity:0;
    z-index:6;
    transition:transform 1s cubic-bezier(.22,1.4,.36,1), opacity .7s ease;
  }
  .bow.show{transform:translate(-50%,0) scale(1);opacity:1;}

  .letter{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
    pointer-events:none;
    opacity:0;
    transition:opacity .8s ease;
  }
  .letter.show{opacity:1;pointer-events:auto;}
  .letter-card{
    max-width:520px;
    width:100%;
    max-height:80dvh;
    overflow-y:auto;
    background:rgba(255,246,226,0.94);
    color:var(--tinta);
    border-radius:22px;
    padding:34px 30px;
    box-shadow:0 30px 70px rgba(20,10,30,0.45), 0 0 0 1px rgba(255,255,255,0.4) inset;
    transform:translateY(24px) scale(.97);
    transition:transform .8s cubic-bezier(.22,1,.36,1);
  }
  .letter.show .letter-card{transform:translateY(0) scale(1);}
  .letter-kicker{
    margin:0 0 6px;
    font-family:var(--font-hand);
    font-size:1.5rem;
    color:var(--cinta);
    font-weight:700;
  }
  .letter-text{
    margin:0;
    font-family:var(--font-display);
    font-size:clamp(1.02rem,3vw,1.18rem);
    line-height:1.7;
    white-space:pre-wrap;
  }
  .caret{display:inline-block;width:2px;background:var(--cinta);margin-left:1px;animation:caretblink 1s step-end infinite;}
  @keyframes caretblink{50%{opacity:0;}}
  .signature{
    margin:18px 0 0;
    font-family:var(--font-hand);
    font-size:1.6rem;
    color:var(--cinta-deep);
    opacity:0;
    transition:opacity .6s ease;
  }
  .signature.show{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .firefly, .star{animation-duration:.001ms !important;}
    .open-btn:hover{transform:none;}
  }
  body.reduced .firefly{display:none;}
  body.reduced .flower.sway .head{animation-name:bloom;animation-duration:.75s;animation-iteration-count:1;}
</style>

<div class="scene" id="scene">
  <div class="sky sky-night"></div>
  <div class="sky sky-day"></div>
  <canvas id="petal-canvas"></canvas>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="fireflies" id="fireflies" aria-hidden="true"></div>

  <main class="hero" id="hero">
    <p class="eyebrow">21 de septiembre &mdash; Día Internacional de las Flores Amarillas</p>
    <h1 class="title">Para <em class="name">Fernanda</em></h1>
    <p class="lede">Cuentan que hoy, cuando el equinoccio cambia la luz del cielo, una flor amarilla dice lo que a veces cuesta decir con palabras.</p>
    <button class="open-btn" id="open-btn" type="button">
      <span>Abrir tu jardín</span>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="3.6" fill="#6b3714"/>
        <g fill="#7a4a12">
          <ellipse cx="12" cy="5" rx="2.3" ry="4" />
          <ellipse cx="12" cy="19" rx="2.3" ry="4" />
          <ellipse cx="5" cy="12" rx="4" ry="2.3" />
          <ellipse cx="19" cy="12" rx="4" ry="2.3" />
        </g>
      </svg>
    </button>
  </main>

  <div class="ground" id="ground" aria-hidden="true">
    <svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="none">
      <path d="M0,300 L0,150 Q200,90 420,140 T860,120 T1200,150 L1200,300 Z" fill="#33531f"/>
      <path d="M0,300 L0,190 Q260,150 520,185 T1000,170 T1200,190 L1200,300 Z" fill="#456a2c"/>
    </svg>
    <div class="flowerbed" id="flowerbed"></div>
    <svg class="bow" id="bow" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
      <path d="M50,35 L10,10 Q0,8 4,25 Q8,40 30,36 Z" fill="var(--cinta)"/>
      <path d="M50,35 L90,10 Q100,8 96,25 Q92,40 70,36 Z" fill="var(--cinta)"/>
      <path d="M50,35 L36,64 Q34,70 42,66 L50,52 L58,66 Q66,70 64,64 Z" fill="var(--cinta-deep)"/>
      <circle cx="50" cy="35" r="9" fill="var(--cinta-deep)"/>
    </svg>
  </div>

  <section class="letter" id="letter">
    <div class="letter-card">
      <p class="letter-kicker">Un mensaje para ti</p>
      <p class="letter-text" id="letter-text"></p>
      <p class="signature" id="signature">Te quiero mucho. 🌻</p>
    </div>
  </section>

  <button class="replay-btn" id="replay-btn" type="button">Volver a ver ↺</button>
</div>

<script>
(function(){
  "use strict";
  var scene = document.getElementById('scene');
  var openBtn = document.getElementById('open-btn');
  var replayBtn = document.getElementById('replay-btn');
  var flowerbed = document.getElementById('flowerbed');
  var bow = document.getElementById('bow');
  var letter = document.getElementById('letter');
  var letterText = document.getElementById('letter-text');
  var signature = document.getElementById('signature');
  var starsWrap = document.getElementById('stars');
  var firefliesWrap = document.getElementById('fireflies');
  var canvas = document.getElementById('petal-canvas');
  var ctx = canvas.getContext('2d');

  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(REDUCE){ document.body.classList.add('reduced'); }

  var NS = 'http://www.w3.org/2000/svg';
  var flowers = [];
  var opened = false;

  function buildStars(){
    var n = 70;
    var frag = document.createDocumentFragment();
    for(var i=0;i<n;i++){
      var s = document.createElement('div');
      s.className = 'star';
      s.style.left = (Math.random()*100)+'%';
      s.style.top = (Math.random()*55)+'%';
      var size = (Math.random()*1.6+0.6);
      s.style.width = size+'px';
      s.style.height = size+'px';
      s.style.animationDelay = (Math.random()*4)+'s';
      frag.appendChild(s);
    }
    starsWrap.appendChild(frag);
  }

  function buildFireflies(){
    var n = 12;
    var frag = document.createDocumentFragment();
    for(var i=0;i<n;i++){
      var f = document.createElement('div');
      f.className = 'firefly';
      f.style.left = (10+Math.random()*80)+'%';
      f.style.top = (35+Math.random()*55)+'%';
      f.style.setProperty('--dx1', (Math.random()*60-30)+'px');
      f.style.setProperty('--dy1', (Math.random()*40-40)+'px');
      f.style.setProperty('--dx2', (Math.random()*60-30)+'px');
      f.style.setProperty('--dy2', (Math.random()*40-20)+'px');
      f.style.setProperty('--dx3', (Math.random()*60-30)+'px');
      f.style.setProperty('--dy3', (Math.random()*40-40)+'px');
      f.style.animationDelay = (Math.random()*5)+'s, '+(Math.random()*2.6)+'s';
      frag.appendChild(f);
    }
    firefliesWrap.appendChild(frag);
  }

  function svgEl(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for(var k in attrs){ el.setAttribute(k, attrs[k]); }
    return el;
  }

  function makeFlower(xPercent, scale, delayMs){
    var wrap = document.createElement('div');
    wrap.className = 'flower';
    wrap.style.left = xPercent + '%';
    wrap.style.width = (13*scale) + '%';
    wrap.style.setProperty('--swaydur', (3.6+Math.random()*2).toFixed(2)+'s');

    var svg = svgEl('svg', {viewBox:'0 0 120 210', class:'flower-svg'});

    var leaf1 = svgEl('path', {d:'M58,150 Q34,140 22,158 Q40,168 58,156 Z', class:'leaf'});
    var leaf2 = svgEl('path', {d:'M64,168 Q90,160 100,178 Q80,186 64,174 Z', class:'leaf'});
    svg.appendChild(leaf1);
    svg.appendChild(leaf2);

    var stem = svgEl('path', {d:'M60,206 C54,168 68,132 58,96 C52,80 62,66 60,56', class:'stem'});
    svg.appendChild(stem);

    var head = svgEl('g', {class:'head', transform:'translate(60,50)'});
    var petalCount = 13;
    for(var i=0;i<petalCount;i++){
      var angle = (360/petalCount)*i;
      var fill = (i % 3 === 0) ? 'var(--girasol-deep)' : 'var(--girasol)';
      var petal = svgEl('ellipse', {cx:0, cy:-29, rx:10, ry:23, transform:'rotate('+angle+')', fill:fill, class:'petal'});
      head.appendChild(petal);
    }
    var center = svgEl('circle', {r:16, fill:'var(--centro)', class:'center'});
    head.appendChild(center);
    for(var j=0;j<9;j++){
      var a2 = (Math.PI*2/9)*j;
      var r2 = 7.5;
      var dot = svgEl('circle', {cx:Math.cos(a2)*r2, cy:Math.sin(a2)*r2, r:1.6, fill:'var(--centro-light)'});
      head.appendChild(dot);
    }
    svg.appendChild(head);
    wrap.appendChild(svg);

    var len = 0;
    try{ len = stem.getTotalLength(); }catch(e){ len = 160; }
    stem.style.strokeDasharray = len;
    stem.style.strokeDashoffset = len;

    wrap._stem = stem;
    wrap._delay = delayMs;
    flowerbed.appendChild(wrap);
    return wrap;
  }

  function buildFlowerbed(){
    var layout = [
      {x:6,  s:.78}, {x:19, s:1.0}, {x:31, s:.86},
      {x:45, s:1.12},{x:58, s:.9},  {x:71, s:1.02},
      {x:86, s:.8}
    ];
    layout.forEach(function(p, i){
      makeFlower(p.x, p.s, i*170);
    });
  }

  function growFlowers(){
    flowers = Array.prototype.slice.call(flowerbed.children);
    flowers.forEach(function(f){
      setTimeout(function(){
        f.classList.add('grow');
        requestAnimationFrame(function(){
          f._stem.style.strokeDashoffset = 0;
        });
        setTimeout(function(){
          f.classList.add('bloomed');
          setTimeout(function(){ f.classList.add('sway'); }, 780);
        }, 420);
      }, f._delay);
    });
    var total = flowers.length ? (flowers[flowers.length-1]._delay + 1300) : 1300;
    setTimeout(gatherBouquet, total);
  }

  function gatherBouquet(){
    var n = flowers.length;
    flowers.forEach(function(f, i){
      var spread = (i - (n-1)/2) * 16;
      var rot = (i - (n-1)/2) * 7;
      f.style.setProperty('--fan', spread+'px');
      f.style.setProperty('--frot', rot+'deg');
      f.style.setProperty('--fscale', (0.55 + (i%2)*0.04));
      f.classList.add('gather');
    });
    setTimeout(function(){
      bow.classList.add('show');
    }, 650);
    setTimeout(showLetter, 1500);
  }

  var LETTER = "Fernanda:\n\nDicen que cada 21 de septiembre, cuando el equinoccio cambia la luz del cielo, una flor amarilla puede decir lo que a veces cuesta poner en palabras.\n\nHoy no encontré una sola flor que alcanzara, así que te armé un jardín entero: girasoles que se abren solo para ti y un ramo que se va formando pétalo a pétalo, como se ha ido formando esto que siento.\n\nFeliz Día de las Flores Amarillas. Gracias por ser, sin proponértelo, la razón por la que hasta un día cualquiera se ve más amarillo.";

  function typeText(el, text, speed, done){
    var i = 0;
    el.textContent = '';
    var caret = document.createElement('span');
    caret.className = 'caret';
    el.appendChild(caret);
    var timer = setInterval(function(){
      if(i >= text.length){
        clearInterval(timer);
        if(caret.parentNode) caret.parentNode.removeChild(caret);
        if(done) done();
        return;
      }
      var ch = document.createTextNode(text[i]);
      el.insertBefore(ch, caret);
      i++;
    }, speed);
  }

  function showLetter(){
    letter.classList.add('show');
    typeText(letterText, LETTER, REDUCE ? 4 : 18, function(){
      signature.classList.add('show');
      replayBtn.classList.add('show');
    });
  }

  function openSurprise(){
    if(opened) return;
    opened = true;
    openBtn.disabled = true;
    scene.classList.add('opening');
    setTimeout(growFlowers, 550);
  }

  function resetScene(){
    opened = false;
    scene.classList.remove('opening');
    letter.classList.remove('show');
    replayBtn.classList.remove('show');
    signature.classList.remove('show');
    bow.classList.remove('show');
    letterText.textContent = '';
    flowerbed.innerHTML = '';
    openBtn.disabled = false;
    buildFlowerbed();
  }

  replayBtn.addEventListener('click', resetScene);
  openBtn.addEventListener('click', openSurprise);

  /* ---- petal canvas ---- */
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var petals = [];
  var MAX_AMBIENT = REDUCE ? 8 : 26;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  var petalColors = ['#ffc93c', '#f2971d', '#ffe08a'];

  function Petal(x, y, burst){
    this.x = x; this.y = y;
    this.r = 4 + Math.random()*5;
    this.vy = burst ? -(2.4+Math.random()*3.2) : (0.5+Math.random()*0.9);
    this.vx = burst ? (Math.random()*6-3) : 0;
    this.phase = Math.random()*Math.PI*2;
    this.swayAmp = 0.6+Math.random()*0.8;
    this.rot = Math.random()*Math.PI*2;
    this.vr = (Math.random()*0.03-0.015);
    this.color = petalColors[Math.floor(Math.random()*petalColors.length)];
    this.burst = !!burst;
    this.opacity = 1;
    this.life = 0;
  }
  Petal.prototype.step = function(){
    this.phase += 0.02;
    if(this.burst){
      this.vy += 0.09;
      this.x += this.vx;
      this.y += this.vy;
      this.opacity -= 0.012;
    } else {
      this.y += this.vy;
      this.x += Math.sin(this.phase) * this.swayAmp;
    }
    this.rot += this.vr;
    this.life++;
  };
  Petal.prototype.dead = function(){
    if(this.burst) return this.opacity <= 0;
    return this.y > H + 20;
  };
  Petal.prototype.draw = function(){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = Math.max(this.opacity, 0);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.r, this.r*0.55, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  };

  function spawnAmbient(){
    if(petals.filter(function(p){return !p.burst;}).length < MAX_AMBIENT){
      petals.push(new Petal(Math.random()*W, -10, false));
    }
  }
  function spawnBurst(x, y){
    var n = REDUCE ? 4 : 14;
    for(var i=0;i<n;i++){
      petals.push(new Petal(x, y, true));
    }
  }

  var lastSpawn = 0;
  function loop(t){
    ctx.clearRect(0,0,W,H);
    if(t - lastSpawn > 420){
      spawnAmbient();
      lastSpawn = t;
    }
    for(var i=petals.length-1;i>=0;i--){
      petals[i].step();
      petals[i].draw();
      if(petals[i].dead()) petals.splice(i,1);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  scene.addEventListener('click', function(e){
    if(e.target === openBtn || openBtn.contains(e.target)) return;
    if(e.target === replayBtn) return;
    spawnBurst(e.clientX, e.clientY);
  });

  buildStars();
  buildFireflies();
  buildFlowerbed();
})();
</script>
