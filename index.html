<title>Órbita de Girasoles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* =========================================================
   1. TOKENS — paleta cósmica + tipografías
   ========================================================= */
:root{
  --bg-1:#050603;
  --bg-2:#0c0f06;
  --gold-1:#facc15;
  --gold-2:#eab308;
  --gold-3:#ca8a04;
  --olive-1:#c9d94a;
  --olive-2:#7c8a2e;
  --rose-1:#ff9d6c;
  --rose-2:#e2492c;
  --white:#ffffff;
  --cream:#fdf6e3;
  --cream-deep:#f2e3b8;
  --ink:#2a1a12;
  --paper-1:#f5e6c8;
  --paper-2:#c9a86a;

  --glass-bg:rgba(15,23,42,0.7);
  --glass-border:rgba(250,204,21,0.25);

  --font-script:'Great Vibes', cursive;
  --font-sans:'Poppins', ui-sans-serif, system-ui, sans-serif;
  --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
}

/* =========================================================
   2. RESET — experiencia de pantalla única, sin scroll de página
   ========================================================= */
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  overflow:hidden;
  background:
    radial-gradient(ellipse 92% 72% at 50% 47%, rgba(201,217,74,0.34), transparent 65%),
    radial-gradient(ellipse 50% 42% at 50% 47%, rgba(255,246,204,0.28), transparent 62%),
    radial-gradient(140% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.62) 100%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-1) 100%);
  color:var(--white);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
[hidden]{display:none !important;}

/* =========================================================
   4. ESCENARIO — capa fija (viewport) que contiene el mundo pannable
   ========================================================= */
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
  cursor:grab;
}
#stage.dragging{cursor:grabbing;}
/* mientras se arrastra para girar la galaxia, se pausan las animaciones
   ambientales más pesadas (vaivén de pétalos, flotado de racimos: muchos
   elementos SVG recalculando su filtro a la vez) para que toda la potencia
   se vaya en mover la órbita sin trabarse. El remolino NO se pausa: es una
   sola capa que solo gira con un transform, no cuesta nada mantenerla en
   movimiento. */
#stage.dragging .bouquet-sway,
#stage.dragging .bq-head,
#stage.dragging .cluster{
  animation-play-state:paused;
}

#bg-stars{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* anillo guía: marca la órbita en la que giran los racimos */
.orbit-ring{
  position:fixed;
  top:50%;left:50%;
  border:1px dashed rgba(250,204,21,0.16);
  border-radius:50%;
  pointer-events:none;
  z-index:1;
}

/* halo: resplandor amplio y brillante detrás del remolino, foco visual central */
.nebula{
  position:fixed;
  top:50%;left:50%;
  width:680px;height:680px;
  margin:-340px 0 0 -340px;
  border-radius:50%;
  background:
    radial-gradient(circle, rgba(255,246,204,0.14), transparent 15%),
    radial-gradient(circle, rgba(201,217,74,0.26), transparent 48%),
    radial-gradient(circle, rgba(250,204,21,0.16), transparent 70%);
  filter:blur(12px);
  pointer-events:none;
}

/* remolino de galaxia: brazos espirales generados por JS, girando despacio */
.spiral-galaxy{
  position:fixed;
  top:50%;left:50%;
  pointer-events:none;
  z-index:1;
  animation:nebula-spin 70s linear infinite;
  will-change:transform;
}
.spiral-galaxy svg{width:100%;height:100%;overflow:visible;}
@keyframes nebula-spin{to{transform:rotate(360deg);}}

/* título pequeño, centrado arriba, sin ocupar el espacio que ocupaba el corazón */
.page-title{
  position:fixed;
  top:calc(20px + env(safe-area-inset-top,0px));
  left:0;right:0;
  z-index:5;
  text-align:center;
  pointer-events:none;
  font-family:var(--font-script);
  font-size:clamp(1.8rem,7vw,2.4rem);
  color:var(--white);
  text-shadow:0 0 18px rgba(250,204,21,0.4), 0 2px 10px rgba(0,0,0,0.6);
}

/* =========================================================
   5. RACIMOS — ramos flotantes, tocables, con su etiqueta
   ========================================================= */
/* ancla de órbita: solo mueve `transform` (compositor/GPU), nunca left/top,
   para no forzar un recálculo de layout de toda la página en cada frame */
.orbit-pos{
  position:fixed;
  top:0;left:0;
  pointer-events:none;
  will-change:transform;
}
.orbit-pos .cluster{position:absolute;top:0;left:0;pointer-events:auto;}

.cluster{
  position:fixed;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  border:none;
  background:none;
  padding:0;
  cursor:pointer;
  transform:translate(-50%,-50%) scale(var(--depth,1));
  animation:cluster-bob var(--bobdur,5.5s) ease-in-out infinite;
  animation-delay:var(--bobdelay,0s);
}
@keyframes cluster-bob{
  0%,100%{transform:translate(-50%,-50%) scale(var(--depth,1)) translateY(0) rotate(var(--tilt,0deg));}
  50%{transform:translate(-50%,-50%) scale(var(--depth,1)) translateY(-10px) rotate(calc(var(--tilt,0deg) * -1));}
}
.cluster-bouquet{width:var(--bqw,clamp(62px,16vw,100px));filter:drop-shadow(0 0 7px rgba(250,204,21,0.4));transition:filter .3s ease;}
.cluster:hover .cluster-bouquet, .cluster:focus-visible .cluster-bouquet{filter:drop-shadow(0 0 11px rgba(250,204,21,0.7));}
.cluster.hero .cluster-bouquet{width:clamp(110px,30vw,170px);}
.cluster-label{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-family:var(--font-script);
  font-size:clamp(1rem,3.8vw,1.25rem);
  color:var(--label-color, var(--gold-1));
  white-space:nowrap;
  text-shadow:
    0 0 3px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.9),
    1px 1px 2px rgba(0,0,0,0.95), -1px -1px 2px rgba(0,0,0,0.95),
    1px -1px 2px rgba(0,0,0,0.95), -1px 1px 2px rgba(0,0,0,0.95),
    0 2px 12px rgba(0,0,0,0.8), 0 0 16px var(--label-glow, rgba(250,204,21,0.6));
}
.cluster.hero{gap:16px;}
.cluster.hero .cluster-label{font-size:clamp(1.3rem,5vw,1.6rem);}
.cluster:focus-visible{outline:none;}
.cluster:focus-visible .cluster-label{text-decoration:underline;}

/* =========================================================
   6. CONTROLES DE NAVEGACIÓN
   ========================================================= */
.hint-pill{
  position:fixed;
  bottom:calc(64px + env(safe-area-inset-bottom,0px));
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:9px 18px;
  border-radius:999px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  font-family:var(--font-sans);
  font-size:.8rem;
  color:var(--cream);
  opacity:1;
  transition:opacity .6s ease;
  animation:hint-nudge 1.8s ease-in-out infinite;
}
.hint-pill.hide{opacity:0;pointer-events:none;}
@keyframes hint-nudge{0%,100%{transform:translateX(-50%);}50%{transform:translateX(calc(-50% + 6px));}}

/* =========================================================
   7. MODAL — la carta que se abre al tocar un racimo
   ========================================================= */
.modal-overlay{
  position:fixed;
  inset:0;
  z-index:60;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:rgba(2,6,23,0.75);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease;
}
.modal-overlay.active{opacity:1;pointer-events:auto;}

.modal-card{
  position:relative;
  width:100%;
  max-width:420px;
  max-height:86dvh;
  overflow-y:auto;
  border-radius:22px;
  padding:36px 26px 28px;
  background:linear-gradient(180deg, var(--cream), var(--cream-deep));
  border:1px solid rgba(202,138,4,0.35);
  box-shadow:0 30px 80px rgba(0,0,0,0.55);
  text-align:center;
  color:var(--ink);
  transform:scale(.9) translateY(16px);
  opacity:0;
  transition:transform .4s cubic-bezier(.22,1,.36,1), opacity .4s ease;
}
.modal-overlay.active .modal-card{transform:scale(1) translateY(0);opacity:1;}

.corner-flower{position:absolute;width:52px;opacity:.9;}
.corner-flower.tl{top:-12px;left:-12px;transform:rotate(-18deg);}
.corner-flower.br{bottom:-12px;right:-12px;transform:rotate(162deg);}

.modal-title{
  font-family:var(--font-script);
  font-size:clamp(1.9rem,8vw,2.4rem);
  color:var(--rose-2);
}
.modal-bouquet{width:150px;margin:6px auto 4px;}
.modal-text{
  margin-top:10px;
  font-size:1.02rem;
  line-height:1.65;
  white-space:pre-wrap;
}
.modal-text b{color:var(--gold-3);}
.modal-caret{display:inline-block;width:2px;background:var(--rose-2);margin-left:1px;animation:caret-blink 1s step-end infinite;}
@keyframes caret-blink{50%{opacity:0;}}

.modal-close-btn{
  margin-top:22px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:11px 26px;
  border-radius:999px;
  border:none;
  font-family:var(--font-sans);
  font-weight:600;
  font-size:.9rem;
  color:var(--ink);
  background:linear-gradient(135deg, var(--gold-1), var(--gold-2));
  cursor:pointer;
  transition:transform .2s ease;
}
.modal-close-btn:hover{transform:translateY(-1px) scale(1.03);}

/* =========================================================
   8. ACCESIBILIDAD
   ========================================================= */
@media (prefers-reduced-motion: reduce){
  .spiral-galaxy,.cluster,.hint-pill{animation-duration:.001ms !important;}
}
</style>

<!-- =========================================================
     ESCENARIO PRINCIPAL: todo gira alrededor de un único punto central
     ========================================================= -->
<div id="stage">
  <canvas id="bg-stars"></canvas>
  <div class="orbit-ring" id="orbit-ring" aria-hidden="true"></div>
  <div class="nebula" id="nebula"></div>
  <div class="spiral-galaxy" id="spiral-galaxy"></div>
  <div id="clusters-layer"></div>
</div>

<p class="page-title">Fernanda</p>

<p class="hint-pill" id="hint-pill">Arrastra para girar la galaxia &#8635;</p>

<!-- =========================================================
     MODAL: la carta que se abre al tocar cada racimo
     ========================================================= -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <svg class="corner-flower tl" viewBox="0 0 60 60"></svg>
    <svg class="corner-flower br" viewBox="0 0 60 60"></svg>
    <h2 class="modal-title" id="modal-title">Mi amor canelita&hellip;</h2>
    <div class="modal-bouquet" id="modal-bouquet" hidden></div>
    <p class="modal-text" id="modal-text"></p>
    <button class="modal-close-btn" id="modal-close-btn" type="button">Cerrar &#127803;</button>
  </div>
</div>

<script>
"use strict";
var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var NS = 'http://www.w3.org/2000/svg';

/* =========================================================
   MÓDULO 1 — fábrica de ramos: girasoles + rosas + envoltorio
   ========================================================= */
function svgEl(tag, attrs){
  var n = document.createElementNS(NS, tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function buildBouquet(uid){
  var svg = svgEl('svg', { viewBox: '0 0 300 340' });
  svg.style.width = '100%';
  svg.style.height = 'auto';
  svg.style.display = 'block';

  var defs = svgEl('defs', {});
  var sunGrad = svgEl('linearGradient', { id: 'pg-sun-' + uid, x1: 0, y1: 0, x2: 0, y2: 1 });
  sunGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': '#fff3b0' }));
  sunGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': '#f2971d' }));
  var roseGrad = svgEl('linearGradient', { id: 'pg-rose-' + uid, x1: 0, y1: 0, x2: 0, y2: 1 });
  roseGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': 'var(--rose-1)' }));
  roseGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': 'var(--rose-2)' }));
  var marigoldGrad = svgEl('linearGradient', { id: 'pg-marigold-' + uid, x1: 0, y1: 0, x2: 0, y2: 1 });
  marigoldGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': '#ffb020' }));
  marigoldGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': '#d94a1c' }));
  var paperGrad = svgEl('linearGradient', { id: 'pg-paper-' + uid, x1: 0, y1: 0, x2: 0, y2: 1 });
  paperGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': 'var(--paper-1)' }));
  paperGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': 'var(--paper-2)' }));
  var leafGrad = svgEl('linearGradient', { id: 'pg-leaf-' + uid, x1: 0, y1: 0, x2: 1, y2: 0.3 });
  leafGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': '#5c8a41' }));
  leafGrad.appendChild(svgEl('stop', { offset: '55%', 'stop-color': '#4a7433' }));
  leafGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': '#2f5322' }));
  var shadowGrad = svgEl('radialGradient', { id: 'pg-shadow-' + uid });
  shadowGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': 'rgba(0,0,0,0.5)' }));
  shadowGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': 'rgba(0,0,0,0)' }));
  defs.appendChild(sunGrad); defs.appendChild(roseGrad); defs.appendChild(marigoldGrad); defs.appendChild(paperGrad); defs.appendChild(leafGrad); defs.appendChild(shadowGrad);
  svg.appendChild(defs);

  var group = svgEl('g', { class: 'bouquet-sway' });
  var tieX = 150, tieY = 300;

  /* sombra que ancla el ramo al suelo */
  svg.appendChild(svgEl('ellipse', { cx: tieX, cy: tieY + 20, rx: 56, ry: 12, fill: 'url(#pg-shadow-' + uid + ')' }));

  var heads = [
    { x: 150, y: 74,  s: 1.18, r: 0,   type: 'sun'      },
    { x: 108, y: 94,  s: 0.98, r: -13, type: 'sun'      },
    { x: 192, y: 94,  s: 0.98, r: 13,  type: 'sun'      },
    { x: 128, y: 112, s: 0.82, r: -8,  type: 'rose'     },
    { x: 172, y: 112, s: 0.82, r: 8,   type: 'rose'     },
    { x: 150, y: 100, s: 0.7,  r: 0,   type: 'marigold' },
    { x: 76,  y: 132, s: 0.86, r: -22, type: 'sun'      },
    { x: 224, y: 132, s: 0.86, r: 22,  type: 'sun'      },
    { x: 150, y: 136, s: 0.72, r: 0,   type: 'marigold' }
  ];

  /* envoltorio de papel, detrás de todo, con facetas para dar textura de arrugado */
  group.appendChild(svgEl('path', {
    d: 'M' + (tieX - 46) + ',' + (tieY + 26) + ' L' + (tieX - 22) + ',' + (tieY - 74) +
       ' L' + (tieX + 22) + ',' + (tieY - 74) + ' L' + (tieX + 46) + ',' + (tieY + 26) + ' Z',
    fill: 'url(#pg-paper-' + uid + ')'
  }));
  group.appendChild(svgEl('path', {
    d: 'M' + (tieX - 46) + ',' + (tieY + 26) + ' L' + (tieX - 22) + ',' + (tieY - 74) +
       ' L' + tieX + ',' + (tieY - 60) + ' L' + (tieX - 30) + ',' + (tieY + 24) + ' Z',
    fill: '#ffffff', opacity: 0.14
  }));
  group.appendChild(svgEl('path', {
    d: 'M' + (tieX + 46) + ',' + (tieY + 26) + ' L' + (tieX + 22) + ',' + (tieY - 74) +
       ' L' + tieX + ',' + (tieY - 60) + ' L' + (tieX + 30) + ',' + (tieY + 24) + ' Z',
    fill: '#000000', opacity: 0.12
  }));
  group.appendChild(svgEl('path', {
    d: 'M' + tieX + ',' + (tieY - 72) + ' Q' + (tieX - 6) + ',' + (tieY - 30) + ' ' + tieX + ',' + (tieY + 24),
    fill: 'none', stroke: '#000000', 'stroke-width': 1.4, opacity: 0.18
  }));

  /* tallos: curva desde el punto de amarre hasta cada cabeza */
  function stemCurve(h){
    return {
      p0: [tieX, tieY],
      p1: [tieX + (h.x - tieX) * 0.5, tieY - (tieY - h.y) * 0.55],
      p2: [h.x, h.y + 14]
    };
  }
  heads.forEach(function(h){
    var c = stemCurve(h);
    group.appendChild(svgEl('path', {
      d: 'M' + c.p0[0] + ',' + c.p0[1] + ' Q' + c.p1[0] + ',' + c.p1[1] + ' ' + c.p2[0] + ',' + c.p2[1],
      fill: 'none', stroke: '#3f6b2b', 'stroke-width': 3, 'stroke-linecap': 'round'
    }));
  });

  /* hojas: forma lanceolada con borde dentado y venas marcadas, generada
     por puntos (como la hoja de girasol de referencia) en vez del óvalo
     liso de antes. Una por tallo, a distintas alturas -no solo cerca de
     la base-, mirando hacia arriba (el ángulo es la dirección real desde
     el punto de amarre hasta ese punto del tallo, que siempre apunta
     hacia arriba y hacia afuera, nunca hacia abajo). */
  function bezierPoint(c, u){
    var mu = 1 - u;
    return [
      mu * mu * c.p0[0] + 2 * mu * u * c.p1[0] + u * u * c.p2[0],
      mu * mu * c.p0[1] + 2 * mu * u * c.p1[1] + u * u * c.p2[1]
    ];
  }
  function bezierTangentDeg(c, u){
    var dx = 2 * (1 - u) * (c.p1[0] - c.p0[0]) + 2 * u * (c.p2[0] - c.p1[0]);
    var dy = 2 * (1 - u) * (c.p1[1] - c.p0[1]) + 2 * u * (c.p2[1] - c.p1[1]);
    return Math.atan2(dy, dx) * 180 / Math.PI;
  }
  /* la hoja se curva un poco hacia arriba en su propio largo (la "vena
     central" no es recta), para que se vea erguida y viva, no lacia */
  function buildLeaf(len, maxW, teeth, bow){
    var g = svgEl('g', {});
    var steps = teeth * 2;
    function mid(s){ return -bow * Math.sin(Math.PI * s); }
    var top = [], bottom = [];
    for (var i = 0; i <= steps; i++){
      var s = i / steps;
      var envelope = Math.sin(Math.PI * Math.pow(s, 0.72));
      var tooth = (i > 0 && i < steps && i % 2 === 0) ? 0.74 : 1;
      var half = maxW * envelope * tooth;
      var m = mid(s);
      top.push([len * s, m - half]);
      bottom.push([len * s, m + half]);
    }
    var d = 'M0,0';
    top.forEach(function(p){ d += ' L' + p[0].toFixed(1) + ',' + p[1].toFixed(1); });
    for (var j = bottom.length - 2; j >= 0; j--){
      d += ' L' + bottom[j][0].toFixed(1) + ',' + bottom[j][1].toFixed(1);
    }
    d += ' Z';
    g.appendChild(svgEl('path', { d: d, fill: 'url(#pg-leaf-' + uid + ')' }));

    /* vena central (curva) + venas secundarias en diagonal */
    var midD = 'M2,' + mid(2 / len).toFixed(1);
    for (var k = 1; k <= 6; k++){ var s2 = k / 6; midD += ' L' + (len * s2).toFixed(1) + ',' + mid(s2).toFixed(1); }
    g.appendChild(svgEl('path', { d: midD, fill: 'none', stroke: '#213e17', 'stroke-width': 0.7, opacity: 0.65 }));
    [0.28, 0.55].forEach(function(s){
      var vx = len * s, vy = mid(s);
      var vw = maxW * Math.sin(Math.PI * Math.pow(s, 0.72)) * 0.72;
      g.appendChild(svgEl('path', {
        d: 'M' + vx.toFixed(1) + ',' + vy.toFixed(1) + ' L' + (vx + vw * 0.7).toFixed(1) + ',' + (vy - vw).toFixed(1),
        fill: 'none', stroke: '#213e17', 'stroke-width': 0.5, opacity: 0.5
      }));
      g.appendChild(svgEl('path', {
        d: 'M' + vx.toFixed(1) + ',' + vy.toFixed(1) + ' L' + (vx + vw * 0.7).toFixed(1) + ',' + (vy + vw).toFixed(1),
        fill: 'none', stroke: '#213e17', 'stroke-width': 0.5, opacity: 0.5
      }));
    });
    return g;
  }
  /* ángulo: no en línea recta con el tallo (se veía marchita, como un
     palito apuntando arriba) sino abierta respecto a él, como una "V",
     usando la tangente del tallo en ese punto más un giro hacia afuera */
  var leafStems = heads.filter(function(h){ return h.type !== 'marigold'; });
  leafStems.forEach(function(h, i){
    var c = stemCurve(h);
    var u = 0.3 + (i % 3) * 0.14; /* distintas alturas a lo largo del tallo */
    var p = bezierPoint(c, u);
    var tangentDeg = bezierTangentDeg(c, u);
    var side = i % 2 === 0 ? 1 : -1;
    var openAngle = side * (42 + Math.random() * 16);
    var leaf = svgEl('g', {
      transform: 'translate(' + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ') rotate(' + (tangentDeg + openAngle).toFixed(1) + ') scale(' + (0.78 + Math.random() * 0.3).toFixed(2) + ')'
    });
    leaf.appendChild(buildLeaf(34, 8.5, 5, 4));
    group.appendChild(leaf);
  });

  /* lazo sobre el envoltorio */
  group.appendChild(svgEl('path', { d: 'M150,298 L112,275 Q104,272 108,288 Q112,302 132,298 Z', fill: '#7a2e2f' }));
  group.appendChild(svgEl('path', { d: 'M150,298 L188,275 Q196,272 192,288 Q188,302 168,298 Z', fill: '#7a2e2f' }));
  group.appendChild(svgEl('circle', { cx: 150, cy: 298, r: 7, fill: '#5c2022' }));

  /* cabezas: ancla estática (posición) + capa animada (vida propia) separadas,
     porque un transform por CSS reemplaza -no combina- al atributo transform de SVG */
  heads.forEach(function(h, i){
    var anchor = svgEl('g', {
      transform: 'translate(' + h.x + ',' + h.y + ') scale(' + h.s + ') rotate(' + h.r + ')'
    });
    var head = svgEl('g', { class: 'bq-head' });
    head.style.animation = 'bq-shimmer ' + (3.6 + Math.random() * 1.6).toFixed(2) + 's ease-in-out infinite';
    head.style.animationDelay = (i * 0.18).toFixed(2) + 's';
    head.style.transformOrigin = 'center';

    if (h.type === 'sun'){
      var layerDefs = [
        { count: 10, baseR: 21, rx: 7.5, ry: 16, offset: 0 },
        { count: 9,  baseR: 15, rx: 6,   ry: 12.5, offset: 20 }
      ];
      layerDefs.forEach(function(layer){
        for (var p = 0; p < layer.count; p++){
          var angle = (360 / layer.count) * p + layer.offset;
          head.appendChild(svgEl('ellipse', {
            cx: 0, cy: -layer.baseR, rx: layer.rx, ry: layer.ry,
            transform: 'rotate(' + angle + ')',
            fill: 'url(#pg-sun-' + uid + ')',
            stroke: 'rgba(120,60,10,0.22)', 'stroke-width': 0.6
          }));
        }
      });
      head.appendChild(svgEl('circle', { r: 10.5, fill: '#6b3714' }));
      for (var d = 0; d < 8; d++){
        var a2 = (Math.PI * 2 / 8) * d;
        head.appendChild(svgEl('circle', {
          cx: Math.cos(a2) * 5, cy: Math.sin(a2) * 5, r: 1.1, fill: '#8a4a1c'
        }));
      }
      head.appendChild(svgEl('ellipse', { cx: -3, cy: -3, rx: 3, ry: 2, fill: '#ffffff', opacity: 0.35 }));
    } else if (h.type === 'rose') {
      for (var ring = 0; ring < 4; ring++){
        var rCount = 6;
        var radius = 11 - ring * 2.2;
        var rOffset = ring * 25;
        for (var rp = 0; rp < rCount; rp++){
          var rAngle = (360 / rCount) * rp + rOffset;
          head.appendChild(svgEl('ellipse', {
            cx: 0, cy: -radius, rx: Math.max(5 - ring * 0.6, 2), ry: Math.max(8 - ring * 1, 3),
            transform: 'rotate(' + rAngle + ')',
            fill: 'url(#pg-rose-' + uid + ')',
            opacity: (1 - ring * 0.08).toFixed(2),
            stroke: 'rgba(120,20,10,0.2)', 'stroke-width': 0.5
          }));
        }
      }
      head.appendChild(svgEl('circle', { r: 2.6, fill: '#7a1f14' }));
    } else {
      /* caléndula: pétalos angostos y apretados, para un acento de color denso */
      for (var mRing = 0; mRing < 2; mRing++){
        var mCount = 8;
        var mRadius = 8 - mRing * 2.5;
        var mOffset = mRing * 22;
        for (var mp = 0; mp < mCount; mp++){
          var mAngle = (360 / mCount) * mp + mOffset;
          head.appendChild(svgEl('ellipse', {
            cx: 0, cy: -mRadius, rx: 2.2, ry: Math.max(6 - mRing * 1.2, 3),
            transform: 'rotate(' + mAngle + ')',
            fill: 'url(#pg-marigold-' + uid + ')',
            opacity: (1 - mRing * 0.1).toFixed(2)
          }));
        }
      }
      head.appendChild(svgEl('circle', { r: 2.2, fill: '#8a2a10' }));
    }
    anchor.appendChild(head);
    group.appendChild(anchor);
  });

  svg.appendChild(group);
  return svg;
}

/* =========================================================
   MÓDULO 1B — el remolino de galaxia y el corazón de polvo dorado
   ========================================================= */
function buildSpiralGalaxy(container){
  var svg = svgEl('svg', { viewBox: '0 0 300 300' });
  var defs = svgEl('defs', {});
  var coreGrad = svgEl('radialGradient', { id: 'spiral-core' });
  coreGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': 'rgba(255,253,240,0.55)' }));
  coreGrad.appendChild(svgEl('stop', { offset: '40%', 'stop-color': 'rgba(255,231,137,0.32)' }));
  coreGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': 'transparent' }));
  defs.appendChild(coreGrad);
  svg.appendChild(defs);

  svg.appendChild(svgEl('circle', { cx: 150, cy: 150, r: 40, fill: 'url(#spiral-core)' }));

  /* el aro de la órbita es una elipse achatada (0.55 en el eje vertical),
     no un círculo -si el remolino se dibuja como círculo perfecto, sus
     puntos siempre se quedan cortos arriba/abajo aunque lleguen bien a
     los lados-. Aplicando el mismo achatado aquí, el remolino traza
     justo el contorno del aro por todos lados. */
  var SQUASH = 0.55;
  var MIN_R = 55;
  var MAX_R = 140;
  var cx = 150, cy = 150;

  function polar(r, ang){
    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang) * SQUASH];
  }

  /* puntos blancos súper pequeños, sin líneas ni brillo, en varios brazos
     repartidos en espejo (equidistantes) para que se note bien la forma
     de remolino. */
  var arms = 34;
  for (var a = 0; a < arms; a++){
    var baseAngle = (360 / arms) * a;
    for (var t = 0; t <= 4.4; t += 0.055){
      var r = 4 * Math.exp(0.79 * t);
      if (r > MAX_R) break;
      if (r < MIN_R) continue;
      var ang = t + baseAngle * Math.PI / 180;
      var pt = polar(r, ang);
      var px = pt[0] + (Math.random() * 4 - 2);
      var py = pt[1] + (Math.random() * 4 - 2) * SQUASH;
      var fade = 1 - Math.min(r / MAX_R, 1);
      svg.appendChild(svgEl('circle', {
        cx: px.toFixed(1), cy: py.toFixed(1),
        r: (0.35 + Math.random() * 0.55).toFixed(2),
        fill: '#ffffff',
        opacity: (0.45 + fade * 0.5).toFixed(2)
      }));
    }
  }

  /* florecitas sueltas (sin tallo, solo la flor) repartidas en espejo
     entre los brazos, en dos anillos concéntricos */
  var flowerGrad = svgEl('linearGradient', { id: 'spiral-flower-grad', x1: 0, y1: 0, x2: 0, y2: 1 });
  flowerGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': '#fff3b0' }));
  flowerGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': '#f2971d' }));
  defs.appendChild(flowerGrad);

  function miniFlower(size){
    var g = svgEl('g', {});
    var petals = 7;
    for (var p = 0; p < petals; p++){
      g.appendChild(svgEl('ellipse', {
        cx: 0, cy: -size * 0.62, rx: size * 0.32, ry: size * 0.62,
        transform: 'rotate(' + ((360 / petals) * p) + ')',
        fill: 'url(#spiral-flower-grad)'
      }));
    }
    g.appendChild(svgEl('circle', { r: size * 0.34, fill: '#6b3714' }));
    return g;
  }
  [
    { count: 6, r: 80,  size: 5.5 },
    { count: 8, r: 112, size: 4.2 }
  ].forEach(function(ring){
    for (var i = 0; i < ring.count; i++){
      var ang = (Math.PI * 2 / ring.count) * i;
      var pt = polar(ring.r, ang);
      var fg = svgEl('g', { transform: 'translate(' + pt[0].toFixed(1) + ',' + pt[1].toFixed(1) + ') rotate(' + (ang * 180 / Math.PI).toFixed(1) + ')' });
      fg.appendChild(miniFlower(ring.size));
      svg.appendChild(fg);
    }
  });
  container.appendChild(svg);
}

/* los demás racimos: cada uno gira alrededor del centro a su propio radio.
   Cada uno va dentro de un "ancla" que solo mueve `transform` (translate3d),
   nunca left/top: así el navegador lo compone en la GPU en vez de recalcular
   el layout de la página 60 veces por segundo (eso era lo que iba lento). */
var orbitItems = CLUSTERS.map(function(c, i){
  var el = makeClusterEl(c, i);
  var pos = document.createElement('div');
  pos.className = 'orbit-pos';
  pos.appendChild(el);
  clustersLayer.appendChild(pos);
  return {
    pos: pos,
    baseAngle: (360 / CLUSTERS.length) * i + (Math.random() * 10 - 5),
    radiusFactor: 0.94 + Math.random() * 0.16
  };
});

/* =========================================================
   MÓDULO 3 — estrellas: cielo fijo de fondo
   ========================================================= */
/* Rendimiento: la mayoría de las estrellas (blancas, quietas) se dibujan UNA
   sola vez en un canvas aparte y de ahí en adelante solo se copian con
   drawImage (una llamada). Solo las motas doradas -las que de verdad se
   notan titilando- se vuelven a dibujar cada frame; así se pasa de ~800
   operaciones de canvas por frame a un puñado. */
function makeStarfield(canvas, width, twinkle){
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var H = window.innerHeight;
  canvas.width = width * DPR;
  canvas.height = H * DPR;
  canvas.style.width = width + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var staticCanvas = document.createElement('canvas');
  staticCanvas.width = canvas.width;
  staticCanvas.height = canvas.height;
  var sctx = staticCanvas.getContext('2d');
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var count = Math.min(420, Math.floor((width * H) / 4200));
  var goldCount = Math.min(70, Math.floor(count * 0.22));

  for (var i = 0; i < count; i++){
    var r = Math.random() * 1.4 + 0.3;
    sctx.globalAlpha = 0.35 + Math.random() * 0.5;
    sctx.fillStyle = '#ffffff';
    sctx.beginPath();
    sctx.arc(Math.random() * width, Math.random() * H, r, 0, Math.PI * 2);
    sctx.fill();
  }
  sctx.globalAlpha = 1;

  var goldStars = [];
  var TWINKLE_SPEED = (Math.PI * 2) / 3000; /* 1 parpadeo completo cada 3s */
  for (var g = 0; g < goldCount; g++){
    goldStars.push({
      x: Math.random() * width,
      y: Math.random() * H,
      r: Math.random() * 2.2 + 1.1,
      phase: Math.random() * Math.PI * 2,
      speed: TWINKLE_SPEED * (0.9 + Math.random() * 0.2)
    });
  }

  /* Rendimiento: no hace falta redibujar el titileo a 60fps para que se
     vea bien -de hecho se ve mejor lento-, así que el canvas solo se
     repinta 1 de cada 2 frames (≈30fps) para esta capa. */
  var skip = false;
  function draw(t){
    if (twinkle && !REDUCE){
      if (typeof dragging !== 'undefined' && dragging){ requestAnimationFrame(draw); return; }
      skip = !skip;
      if (skip){ requestAnimationFrame(draw); return; }
    }
    ctx.clearRect(0, 0, width, H);
    ctx.drawImage(staticCanvas, 0, 0, width, H);
    for (var i = 0; i < goldStars.length; i++){
      var s = goldStars[i];
      var tw = twinkle && !REDUCE ? (Math.sin(t * s.speed + s.phase) * 0.5 + 0.5) : 0.75;
      var a = 0.25 + tw * 0.75;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ffe08a';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (twinkle && !REDUCE) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  if (REDUCE) draw(0);
}

makeStarfield(document.getElementById('bg-stars'), window.innerWidth, true);

/* =========================================================
   MÓDULO 4 — órbita: todo gira alrededor del corazón central.
   Arrastrar, la rueda y las flechas del teclado giran la galaxia;
   además gira sola muy lentamente, como un sistema solar.
   ========================================================= */
var stage = document.getElementById('stage');
var hintPill = document.getElementById('hint-pill');

var angleOffset = 0;
var AUTOSPIN = REDUCE ? 0 : 0.0065;      // grados por frame: una vuelta completa cada ~7 min
var dragging = false;
var dragStartX = 0;
var angleStart = 0;
var hintHidden = false;

function orbitRadius(){
  return Math.min(360, Math.max(160, Math.min(window.innerWidth, window.innerHeight) * 0.48));
}

/* el aro guía tiene que trazar exactamente el mismo camino elíptico que
   siguen los racimos en positionOrbit() (radio*0.55 en el eje vertical) -
   si no, se ve como un círculo suelto que no tiene nada que ver con la
   órbita real. */
var SPIRAL_MAX_R_VB = 140; /* debe coincidir con MAX_R en buildSpiralGalaxy */
function layoutRing(){
  var R = orbitRadius();
  orbitRing.style.width = (R * 2) + 'px';
  orbitRing.style.height = (R * 0.55 * 2) + 'px';
  orbitRing.style.marginLeft = -R + 'px';
  orbitRing.style.marginTop = -(R * 0.55) + 'px';

  /* el remolino ya dibuja su propio achatado (mismo 0.55 que el aro), así
     que el contenedor se escala sobre el radio horizontal R -su forma
     elíptica interna hace que encaje también en el eje vertical-. */
  var spiralDotMaxPx = R * 0.96;
  var spiralBoxPx = spiralDotMaxPx * (300 / SPIRAL_MAX_R_VB);
  spiralGalaxyEl.style.width = spiralBoxPx + 'px';
  spiralGalaxyEl.style.height = spiralBoxPx + 'px';
  spiralGalaxyEl.style.marginLeft = -(spiralBoxPx / 2) + 'px';
  spiralGalaxyEl.style.marginTop = -(spiralBoxPx / 2) + 'px';
}

function positionOrbit(){
  var cx = window.innerWidth / 2;
  var cy = window.innerHeight / 2;
  var R = orbitRadius();
  orbitItems.forEach(function(item){
    var angleRad = (item.baseAngle + angleOffset) * Math.PI / 180;
    var r = R * item.radiusFactor;
    var x = cx + Math.cos(angleRad) * r;
    var y = cy + Math.sin(angleRad) * r * 0.55; // órbita achatada, efecto de perspectiva
    var depth = (Math.sin(angleRad) + 1) / 2;   // 0 = fondo, 1 = frente
    item.pos.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
    item.pos.style.setProperty('--depth', (0.72 + depth * 0.4).toFixed(2));
    item.pos.style.opacity = (0.55 + depth * 0.45).toFixed(2);
    item.pos.style.zIndex = String(Math.round(depth * 100) + 3);
  });
}

function hideHint(){
  if (hintHidden) return;
  hintHidden = true;
  hintPill.classList.add('hide');
}

function spinLoop(){
  angleOffset += AUTOSPIN;
  positionOrbit();
  requestAnimationFrame(spinLoop);
}

stage.addEventListener('pointerdown', function(e){
  dragging = true;
  stage.classList.add('dragging');
  dragStartX = e.clientX;
  angleStart = angleOffset;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', function(e){
  if (!dragging) return;
  angleOffset = angleStart + (e.clientX - dragStartX) * 0.28;
  if (Math.abs(e.clientX - dragStartX) > 6) hideHint();
});
function endDrag(){
  dragging = false;
  stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

stage.addEventListener('wheel', function(e){
  var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  angleOffset += delta * 0.12;
  hideHint();
  e.preventDefault();
}, { passive: false });

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight'){ angleOffset += 20; hideHint(); }
  if (e.key === 'ArrowLeft'){ angleOffset -= 20; hideHint(); }
});

window.addEventListener('resize', layoutRing);
layoutRing();
positionOrbit();
requestAnimationFrame(spinLoop);

/* =========================================================
   MÓDULO 5 — modal: abrir/cerrar carta + carta especial del centro
   ========================================================= */
var overlay = document.getElementById('modal-overlay');
var modalTitle = document.getElementById('modal-title');
var modalText = document.getElementById('modal-text');
var modalBouquet = document.getElementById('modal-bouquet');
var cornerFlowers = document.querySelectorAll('.corner-flower');

cornerFlowers.forEach(function(el){ fillCornerFlower(el); });

function typeText(el, text, speed, done){
  var i = 0;
  el.textContent = '';
  var caret = document.createElement('span');
  caret.className = 'modal-caret';
  el.appendChild(caret);
  var timer = setInterval(function(){
    if (i >= text.length){
      clearInterval(timer);
      if (caret.parentNode) caret.parentNode.removeChild(caret);
      if (done) done();
      return;
    }
    el.insertBefore(document.createTextNode(text[i]), caret);
    i++;
  }, speed);
}

function openModal(cluster){
  modalTitle.textContent = cluster.hero ? 'Mi amor canelita…' : cluster.label;
  overlay.classList.add('active');

  if (cluster.hero){
    modalBouquet.hidden = false;
    if (!modalBouquet.dataset.built){
      modalBouquet.appendChild(buildBouquet('modal-hero'));
      modalBouquet.dataset.built = '1';
    }
    typeText(modalText, cluster.text, REDUCE ? 4 : 15);
  } else {
    modalBouquet.hidden = true;
    modalText.textContent = cluster.text;
  }
}
function closeModal(){
  overlay.classList.remove('active');
}
document.getElementById('modal-close-btn').addEventListener('click', closeModal);
overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && overlay.classList.contains('active')) closeModal();
});

setTimeout(function(){ if (!hintHidden) hintPill.classList.remove('hide'); }, 900);
