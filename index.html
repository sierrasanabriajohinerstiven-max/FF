<title>Órbita de Girasoles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* =========================================================
   1. TOKENS — paleta cósmica + tipografías
   ========================================================= */
:root{
  --bg-1:#020617;
  --bg-2:#0f172a;
  --gold-1:#facc15;
  --gold-2:#eab308;
  --gold-3:#ca8a04;
  --rose-1:#ff9d6c;
  --rose-2:#e2492c;
  --white:#ffffff;
  --cream:#fdf6e3;
  --cream-deep:#f2e3b8;
  --ink:#2a1a12;
  --paper-1:#f5e6c8;
  --paper-2:#c9a86a;

  --glass-bg:rgba(15,23,42,0.7);
  --glass-border:rgba(250,204,21,0.25);

  --font-script:'Great Vibes', cursive;
  --font-sans:'Poppins', ui-sans-serif, system-ui, sans-serif;
  --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
}

/* =========================================================
   2. RESET — experiencia de pantalla única, sin scroll de página
   ========================================================= */
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  overflow:hidden;
  background:var(--bg-1);
  color:var(--white);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
[hidden]{display:none !important;}

/* =========================================================
   3. INTRO — efecto de "salto a hiperespacio" antes de llegar a la galaxia
   ========================================================= */
#intro{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  background:var(--bg-1);
  transition:opacity .9s ease;
}
#intro.fade-out{opacity:0;pointer-events:none;}
#intro canvas{position:absolute;inset:0;}
#intro p{
  position:relative;
  font-family:var(--font-sans);
  font-size:.8rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--gold-1);
}

/* =========================================================
   4. ESCENARIO — capa fija (viewport) que contiene el mundo pannable
   ========================================================= */
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
  cursor:grab;
}
#stage.dragging{cursor:grabbing;}

#bg-stars{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* anillo guía: marca la órbita en la que giran los racimos */
.orbit-ring{
  position:fixed;
  top:50%;left:50%;
  border:1px dashed rgba(250,204,21,0.16);
  border-radius:50%;
  pointer-events:none;
  z-index:1;
}

/* nebulosa: vórtice brillante que gira lentamente, foco visual central */
.nebula{
  position:fixed;
  top:50%;left:50%;
  width:520px;height:520px;
  margin:-260px 0 0 -260px;
  border-radius:50%;
  background:
    conic-gradient(from 0deg, rgba(250,204,21,0.22), rgba(202,138,4,0.05) 30%, rgba(250,204,21,0.18) 60%, rgba(202,138,4,0.05) 90%, rgba(250,204,21,0.22)),
    radial-gradient(circle, rgba(250,204,21,0.32), transparent 68%);
  filter:blur(6px);
  animation:nebula-spin 40s linear infinite;
  pointer-events:none;
}
@keyframes nebula-spin{to{transform:rotate(360deg);}}

/* corazón de partículas sobre la nebulosa: el punto fijo del que todo cuelga */
.hero-heart{
  position:fixed;
  top:50%;left:50%;
  width:170px;height:154px;
  margin:-330px 0 0 -85px;
  pointer-events:none;
  z-index:2;
}
.hero-heart svg{width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(250,204,21,0.6));animation:heart-beat 2.8s ease-in-out infinite;}
@keyframes heart-beat{
  0%,100%{transform:scale(1);}
  15%{transform:scale(1.07);}
  30%{transform:scale(.98);}
  45%{transform:scale(1.04);}
  60%{transform:scale(1);}
}
.hero-heart .orbit-dot{
  position:absolute;top:50%;left:50%;
  width:6px;height:6px;margin:-3px;
  border-radius:50%;
  background:var(--gold-1);
  box-shadow:0 0 8px 2px rgba(250,204,21,0.85);
  offset-path:circle(105px at 50% 50%);
  animation:orbit 9s linear infinite;
}
@keyframes orbit{to{offset-distance:100%;}}

/* =========================================================
   5. RACIMOS — ramos flotantes, tocables, con su etiqueta
   ========================================================= */
.cluster{
  position:fixed;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  border:none;
  background:none;
  padding:0;
  cursor:pointer;
  transform:translate(-50%,-50%) scale(var(--depth,1));
  animation:cluster-bob var(--bobdur,5.5s) ease-in-out infinite;
  animation-delay:var(--bobdelay,0s);
}
@keyframes cluster-bob{
  0%,100%{transform:translate(-50%,-50%) scale(var(--depth,1)) translateY(0) rotate(var(--tilt,0deg));}
  50%{transform:translate(-50%,-50%) scale(var(--depth,1)) translateY(-10px) rotate(calc(var(--tilt,0deg) * -1));}
}
.cluster-bouquet{width:var(--bqw,clamp(72px,20vw,112px));filter:drop-shadow(0 0 16px rgba(250,204,21,0.35));transition:filter .3s ease;}
.cluster:hover .cluster-bouquet, .cluster:focus-visible .cluster-bouquet{filter:drop-shadow(0 0 24px rgba(250,204,21,0.65));}
.cluster.hero .cluster-bouquet{width:clamp(110px,30vw,170px);}
.cluster-label{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 12px;
  border-radius:999px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-family:var(--font-script);
  font-size:clamp(.95rem,3.6vw,1.15rem);
  color:var(--gold-1);
  white-space:nowrap;
}
.cluster:focus-visible{outline:none;}
.cluster:focus-visible .cluster-label{outline:2px solid var(--gold-1);outline-offset:2px;}

/* =========================================================
   6. CONTROLES DE NAVEGACIÓN — flechas, pista y barra de progreso
   ========================================================= */
.pan-btn{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  z-index:20;
  width:44px;height:44px;
  border-radius:50%;
  border:1px solid var(--glass-border);
  background:var(--glass-bg);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:var(--gold-1);
  font-size:1.4rem;
  line-height:1;
  cursor:pointer;
  transition:background .2s ease, transform .2s ease;
}
.pan-btn:hover{background:rgba(250,204,21,0.14);}
.pan-left{left:14px;}
.pan-right{right:14px;}

.top-bar{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top,0px));
  left:0;right:0;
  z-index:15;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  pointer-events:none;
  text-align:center;
}
.top-eyebrow{
  font-family:var(--font-sans);
  font-size:.68rem;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold-1);
  text-shadow:0 2px 10px rgba(0,0,0,0.6);
}
.top-title{
  font-family:var(--font-script);
  font-size:2rem;
  color:var(--white);
  text-shadow:0 0 18px rgba(250,204,21,0.4);
}

.hint-pill{
  position:fixed;
  bottom:calc(64px + env(safe-area-inset-bottom,0px));
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:9px 18px;
  border-radius:999px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  font-family:var(--font-sans);
  font-size:.8rem;
  color:var(--cream);
  opacity:1;
  transition:opacity .6s ease;
  animation:hint-nudge 1.8s ease-in-out infinite;
}
.hint-pill.hide{opacity:0;pointer-events:none;}
@keyframes hint-nudge{0%,100%{transform:translateX(-50%);}50%{transform:translateX(calc(-50% + 6px));}}

/* =========================================================
   7. MODAL — la carta que se abre al tocar un racimo
   ========================================================= */
.modal-overlay{
  position:fixed;
  inset:0;
  z-index:60;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:rgba(2,6,23,0.75);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease;
}
.modal-overlay.active{opacity:1;pointer-events:auto;}

.modal-card{
  position:relative;
  width:100%;
  max-width:420px;
  max-height:86dvh;
  overflow-y:auto;
  border-radius:22px;
  padding:36px 26px 28px;
  background:linear-gradient(180deg, var(--cream), var(--cream-deep));
  border:1px solid rgba(202,138,4,0.35);
  box-shadow:0 30px 80px rgba(0,0,0,0.55);
  text-align:center;
  color:var(--ink);
  transform:scale(.9) translateY(16px);
  opacity:0;
  transition:transform .4s cubic-bezier(.22,1,.36,1), opacity .4s ease;
}
.modal-overlay.active .modal-card{transform:scale(1) translateY(0);opacity:1;}

.corner-flower{position:absolute;width:52px;opacity:.9;}
.corner-flower.tl{top:-12px;left:-12px;transform:rotate(-18deg);}
.corner-flower.br{bottom:-12px;right:-12px;transform:rotate(162deg);}

.modal-close{
  position:absolute;
  top:12px;right:12px;
  width:30px;height:30px;
  border-radius:50%;
  border:1px solid rgba(202,138,4,0.3);
  background:rgba(255,255,255,0.6);
  color:var(--ink);
  font-size:.9rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s ease;
}
.modal-close:hover{transform:rotate(90deg);}

.modal-title{
  font-family:var(--font-script);
  font-size:clamp(1.9rem,8vw,2.4rem);
  color:var(--rose-2);
}
.modal-bouquet{width:150px;margin:6px auto 4px;}
.modal-text{
  margin-top:10px;
  font-size:1.02rem;
  line-height:1.65;
  white-space:pre-wrap;
}
.modal-text b{color:var(--gold-3);}
.modal-caret{display:inline-block;width:2px;background:var(--rose-2);margin-left:1px;animation:caret-blink 1s step-end infinite;}
@keyframes caret-blink{50%{opacity:0;}}

.modal-close-btn{
  margin-top:22px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:11px 26px;
  border-radius:999px;
  border:none;
  font-family:var(--font-sans);
  font-weight:600;
  font-size:.9rem;
  color:var(--ink);
  background:linear-gradient(135deg, var(--gold-1), var(--gold-2));
  cursor:pointer;
  transition:transform .2s ease;
}
.modal-close-btn:hover{transform:translateY(-1px) scale(1.03);}

/* =========================================================
   8. ACCESIBILIDAD
   ========================================================= */
@media (prefers-reduced-motion: reduce){
  .nebula,.hero-heart svg,.orbit-dot,.cluster,.hint-pill{animation-duration:.001ms !important;}
}
@media (max-width:640px){
  .pan-btn{width:38px;height:38px;font-size:1.2rem;}
  .top-title{font-size:1.6rem;}
}
</style>

<!-- =========================================================
     INTRO: salto a hiperespacio antes de llegar a la galaxia
     ========================================================= -->
<div id="intro">
  <canvas id="warp-canvas"></canvas>
  <p>Preparando tu universo&hellip;</p>
</div>

<!-- =========================================================
     ESCENARIO PRINCIPAL: todo gira alrededor de un único punto central
     ========================================================= -->
<div id="stage">
  <canvas id="bg-stars"></canvas>
  <div class="orbit-ring" id="orbit-ring" aria-hidden="true"></div>
  <div class="nebula" id="nebula"></div>
  <div class="hero-heart" id="hero-heart">
    <svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff6cc"/>
          <stop offset="45%" stop-color="var(--gold-1)"/>
          <stop offset="100%" stop-color="var(--gold-3)"/>
        </linearGradient>
      </defs>
      <path fill="url(#heartGrad)" d="M16 28.5 2.6 15.7C-1.9 11.2 0.4 3.6 6.7 2.4c3.4-0.6 6.8 0.9 8.7 3.7 1.9-2.8 5.3-4.3 8.7-3.7 6.3 1.2 8.6 8.8 4.1 13.3z"/>
    </svg>
    <span class="orbit-dot" style="animation-delay:0s"></span>
    <span class="orbit-dot" style="animation-delay:-3s"></span>
    <span class="orbit-dot" style="animation-delay:-6s"></span>
  </div>
  <div id="clusters-layer"></div>

  <button class="pan-btn pan-left" id="pan-left" type="button" aria-label="Girar la galaxia hacia la izquierda">&#8634;</button>
  <button class="pan-btn pan-right" id="pan-right" type="button" aria-label="Girar la galaxia hacia la derecha">&#8635;</button>
</div>

<div class="top-bar">
  <p class="top-eyebrow">21 de septiembre &middot; Día Internacional de las Flores Amarillas</p>
  <p class="top-title">para Fernanda</p>
</div>

<p class="hint-pill" id="hint-pill">Arrastra para girar la galaxia &#8635;</p>

<!-- =========================================================
     MODAL: la carta que se abre al tocar cada racimo
     ========================================================= -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <svg class="corner-flower tl" viewBox="0 0 60 60"></svg>
    <svg class="corner-flower br" viewBox="0 0 60 60"></svg>
    <button class="modal-close" id="modal-close-x" type="button" aria-label="Cerrar">&#10005;</button>
    <h2 class="modal-title" id="modal-title">Mi amor&hellip;</h2>
    <div class="modal-bouquet" id="modal-bouquet" hidden></div>
    <p class="modal-text" id="modal-text"></p>
    <button class="modal-close-btn" id="modal-close-btn" type="button">Cerrar &#127803;</button>
  </div>
</div>

<script>
"use strict";
var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var NS = 'http://www.w3.org/2000/svg';

/* =========================================================
   MÓDULO 1 — fábrica de ramos: girasoles + rosas + envoltorio
   ========================================================= */
function svgEl(tag, attrs){
  var n = document.createElementNS(NS, tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function buildBouquet(uid){
  var svg = svgEl('svg', { viewBox: '0 0 300 340' });
  svg.style.width = '100%';
  svg.style.height = 'auto';
  svg.style.display = 'block';

  var defs = svgEl('defs', {});
  var sunGrad = svgEl('linearGradient', { id: 'pg-sun-' + uid, x1: 0, y1: 0, x2: 0, y2: 1 });
  sunGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': '#fff3b0' }));
  sunGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': '#f2971d' }));
  var roseGrad = svgEl('linearGradient', { id: 'pg-rose-' + uid, x1: 0, y1: 0, x2: 0, y2: 1 });
  roseGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': 'var(--rose-1)' }));
  roseGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': 'var(--rose-2)' }));
  var paperGrad = svgEl('linearGradient', { id: 'pg-paper-' + uid, x1: 0, y1: 0, x2: 0, y2: 1 });
  paperGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': 'var(--paper-1)' }));
  paperGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': 'var(--paper-2)' }));
  defs.appendChild(sunGrad); defs.appendChild(roseGrad); defs.appendChild(paperGrad);
  svg.appendChild(defs);

  var group = svgEl('g', { class: 'bouquet-sway' });
  var tieX = 150, tieY = 300;

  var heads = [
    { x: 150, y: 78,  s: 1.15, r: 0,   type: 'sun'  },
    { x: 104, y: 100, s: 0.95, r: -14, type: 'sun'  },
    { x: 196, y: 100, s: 0.95, r: 14,  type: 'sun'  },
    { x: 130, y: 120, s: 0.85, r: -6,  type: 'rose' },
    { x: 170, y: 120, s: 0.85, r: 6,   type: 'rose' },
    { x: 70,  y: 142, s: 0.82, r: -24, type: 'sun'  },
    { x: 230, y: 142, s: 0.82, r: 24,  type: 'sun'  }
  ];

  /* envoltorio de papel, detrás de todo */
  group.appendChild(svgEl('path', {
    d: 'M' + (tieX - 46) + ',' + (tieY + 26) + ' L' + (tieX - 22) + ',' + (tieY - 74) +
       ' L' + (tieX + 22) + ',' + (tieY - 74) + ' L' + (tieX + 46) + ',' + (tieY + 26) + ' Z',
    fill: 'url(#pg-paper-' + uid + ')'
  }));

  /* tallos: curva desde el punto de amarre hasta cada cabeza */
  heads.forEach(function(h){
    var ctrlX = tieX + (h.x - tieX) * 0.5;
    var ctrlY = tieY - (tieY - h.y) * 0.55;
    group.appendChild(svgEl('path', {
      d: 'M' + tieX + ',' + tieY + ' Q' + ctrlX + ',' + ctrlY + ' ' + h.x + ',' + (h.y + 14),
      fill: 'none', stroke: '#3f6b2b', 'stroke-width': 3, 'stroke-linecap': 'round'
    }));
  });

  /* un par de hojas para dar volumen */
  group.appendChild(svgEl('path', { d: 'M150,210 Q115,202 100,225 Q125,234 150,218 Z', fill: '#4f7a3a' }));
  group.appendChild(svgEl('path', { d: 'M155,225 Q195,218 210,240 Q180,248 155,233 Z', fill: '#446a31' }));

  /* lazo sobre el envoltorio */
  group.appendChild(svgEl('path', { d: 'M150,298 L112,275 Q104,272 108,288 Q112,302 132,298 Z', fill: '#7a2e2f' }));
  group.appendChild(svgEl('path', { d: 'M150,298 L188,275 Q196,272 192,288 Q188,302 168,298 Z', fill: '#7a2e2f' }));
  group.appendChild(svgEl('circle', { cx: 150, cy: 298, r: 7, fill: '#5c2022' }));

  /* cabezas: ancla estática (posición) + capa animada (vida propia) separadas,
     porque un transform por CSS reemplaza -no combina- al atributo transform de SVG */
  heads.forEach(function(h, i){
    var anchor = svgEl('g', {
      transform: 'translate(' + h.x + ',' + h.y + ') scale(' + h.s + ') rotate(' + h.r + ')'
    });
    var head = svgEl('g', { class: 'bq-head' });
    head.style.animation = 'bq-shimmer ' + (3.6 + Math.random() * 1.6).toFixed(2) + 's ease-in-out infinite';
    head.style.animationDelay = (i * 0.18).toFixed(2) + 's';
    head.style.transformOrigin = 'center';

    if (h.type === 'sun'){
      for (var layer = 0; layer < 2; layer++){
        var count = 8;
        var baseR = layer === 0 ? 20 : 12;
        var offset = layer === 0 ? 0 : 22.5;
        for (var p = 0; p < count; p++){
          var angle = (360 / count) * p + offset;
          head.appendChild(svgEl('ellipse', {
            cx: 0, cy: -baseR, rx: layer === 0 ? 7 : 5, ry: layer === 0 ? 15 : 10,
            transform: 'rotate(' + angle + ')',
            fill: 'url(#pg-sun-' + uid + ')'
          }));
        }
      }
      head.appendChild(svgEl('circle', { r: 10.5, fill: '#6b3714' }));
      for (var d = 0; d < 8; d++){
        var a2 = (Math.PI * 2 / 8) * d;
        head.appendChild(svgEl('circle', {
          cx: Math.cos(a2) * 5, cy: Math.sin(a2) * 5, r: 1.1, fill: '#8a4a1c'
        }));
      }
    } else {
      for (var ring = 0; ring < 4; ring++){
        var rCount = 6;
        var radius = 11 - ring * 2.2;
        var rOffset = ring * 25;
        for (var rp = 0; rp < rCount; rp++){
          var rAngle = (360 / rCount) * rp + rOffset;
          head.appendChild(svgEl('ellipse', {
            cx: 0, cy: -radius, rx: Math.max(5 - ring * 0.6, 2), ry: Math.max(8 - ring * 1, 3),
            transform: 'rotate(' + rAngle + ')',
            fill: 'url(#pg-rose-' + uid + ')',
            opacity: (1 - ring * 0.08).toFixed(2)
          }));
        }
      }
      head.appendChild(svgEl('circle', { r: 2.6, fill: '#7a1f14' }));
    }
    anchor.appendChild(head);
    group.appendChild(anchor);
  });

  svg.appendChild(group);
  return svg;
}

/* pequeño sprite decorativo para las esquinas de la carta */
function fillCornerFlower(svgNode){
  svgNode.innerHTML =
    '<g>' +
    '<ellipse cx="30" cy="12" rx="7" ry="15" fill="#f2971d"/>' +
    '<ellipse cx="30" cy="12" rx="7" ry="15" fill="#ffc93c" transform="rotate(51 30 30)"/>' +
    '<ellipse cx="30" cy="12" rx="7" ry="15" fill="#f2971d" transform="rotate(102 30 30)"/>' +
    '<ellipse cx="30" cy="12" rx="7" ry="15" fill="#ffc93c" transform="rotate(153 30 30)"/>' +
    '<ellipse cx="30" cy="12" rx="7" ry="15" fill="#f2971d" transform="rotate(204 30 30)"/>' +
    '<ellipse cx="30" cy="12" rx="7" ry="15" fill="#ffc93c" transform="rotate(255 30 30)"/>' +
    '<ellipse cx="30" cy="12" rx="7" ry="15" fill="#f2971d" transform="rotate(306 30 30)"/>' +
    '<circle cx="30" cy="30" r="8" fill="#6b3714"/>' +
    '</g>';
}

/* the CSS keyframe used by every flower head (defined once, applied via JS style.animation above) */
var styleTag = document.createElement('style');
styleTag.textContent = '@keyframes bq-shimmer{0%,100%{transform:rotate(-2.5deg) scale(1);}50%{transform:rotate(2.5deg) scale(1.03);}}' +
  '.bouquet-sway{animation:bouquet-sway 6s ease-in-out infinite;transform-origin:150px 300px;}' +

/* =========================================================
   MÓDULO 2 — la galaxia: racimos que orbitan un único punto central
   ========================================================= */
var HERO = { label: 'Mi amor', hero: true,
  text: "Fernanda, hoy es el Día Internacional de las Flores Amarillas y quise construirte un universo entero solo para decirte esto:\n\ncontigo hasta lo más pequeño se siente enorme. Cada girasol de esta galaxia, cada luz dorada, es una forma distinta de decir lo mismo: que me haces muy feliz.\n\nFeliz día de las flores amarillas, mi amor." };

var CLUSTERS = [
  { label: 'Eres mi sol',
    text: 'Cada mañana que despierto pensando en ti confirmo esto: eres la luz que hace que todo lo demás tenga sentido.' },
  { label: 'Te amo',
    text: 'No hay una sola flor amarilla que alcance para decir cuánto te amo, así que mejor te construí un jardín entero de ellas.' },
  { label: 'Eres única',
    text: 'He visto muchos cielos y muchas cosas bonitas en el camino, y ninguna se compara contigo.' },
  { label: 'Amor de mi vida',
    text: 'Si el 21 de septiembre existe para las flores amarillas, que exista también un día solo para recordarte cuánto significas para mí.' },
  { label: 'Me encantas',
    text: 'Me encantas hasta en los detalles más pequeños, de esos que nadie más nota pero yo sí.' },
  { label: 'Eres preciosa',
    text: 'Preciosa no alcanza a describirte, pero es lo más cerca que las palabras logran llegar.' },
  { label: 'Siempre juntos',
    text: 'Pase lo que pase, quiero seguir construyendo jardines contigo. Siempre juntos.' }
];

var clustersLayer = document.getElementById('clusters-layer');
var orbitRing = document.getElementById('orbit-ring');

function makeClusterEl(c, uid, extraClass){
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'cluster' + (extraClass ? ' ' + extraClass : '');
  btn.style.setProperty('--bobdur', (4.6 + Math.random() * 2).toFixed(2) + 's');
  btn.style.setProperty('--bobdelay', (Math.random() * 2).toFixed(2) + 's');
  btn.style.setProperty('--tilt', ((uid % 2 === 0 ? 1 : -1) * (2 + Math.random() * 2)).toFixed(1) + 'deg');

  var bWrap = document.createElement('span');
  bWrap.className = 'cluster-bouquet';
  bWrap.appendChild(buildBouquet('c' + uid));
  btn.appendChild(bWrap);

  var label = document.createElement('span');
  label.className = 'cluster-label';
  label.innerHTML = c.label + ' <span aria-hidden="true">&#128156;</span>';
  btn.appendChild(label);

  btn.addEventListener('click', function(){ openModal(c); });
  return btn;
}

/* el racimo central: el único punto fijo, no orbita */
var heroEl = makeClusterEl(HERO, 99, 'hero');
heroEl.style.left = '50%';
heroEl.style.top = '50%';
heroEl.style.setProperty('--bqw', '170px');
clustersLayer.appendChild(heroEl);

/* los demás racimos: cada uno gira alrededor del centro a su propio radio */
var orbitItems = CLUSTERS.map(function(c, i){
  var el = makeClusterEl(c, i);
  clustersLayer.appendChild(el);
  return {
    el: el,
    baseAngle: (360 / CLUSTERS.length) * i + (Math.random() * 14 - 7),
    radiusFactor: 0.82 + Math.random() * 0.32
  };
});

/* =========================================================
   MÓDULO 3 — estrellas: cielo fijo de fondo
   ========================================================= */
function makeStarfield(canvas, width, twinkle){
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var H = window.innerHeight;
  canvas.width = width * DPR;
  canvas.height = H * DPR;
  canvas.style.width = width + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var count = Math.floor((width * H) / 6500);
  var stars = [];
  for (var i = 0; i < count; i++){
    stars.push({
      x: Math.random() * width,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.015 + Math.random() * 0.02
    });
  }
  function draw(t){
    ctx.clearRect(0, 0, width, H);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var tw = twinkle && !REDUCE ? (Math.sin(t * s.speed + s.phase) * 0.5 + 0.5) : 0.75;
      ctx.globalAlpha = 0.25 + tw * 0.75;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (twinkle && !REDUCE) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  if (REDUCE) draw(0);
}

makeStarfield(document.getElementById('bg-stars'), window.innerWidth, true);

/* =========================================================
   MÓDULO 4 — órbita: todo gira alrededor del corazón central.
   Arrastrar, la rueda, las flechas y el teclado giran la galaxia;
   además gira sola muy lentamente, como un sistema solar.
   ========================================================= */
var stage = document.getElementById('stage');
var panLeftBtn = document.getElementById('pan-left');
var panRightBtn = document.getElementById('pan-right');
var hintPill = document.getElementById('hint-pill');

var angleOffset = 0;
var AUTOSPIN = REDUCE ? 0 : 0.0065;      // grados por frame: una vuelta completa cada ~7 min
var dragging = false;
var dragStartX = 0;
var angleStart = 0;
var hintHidden = false;

function orbitRadius(){
  return Math.min(320, Math.max(120, Math.min(window.innerWidth, window.innerHeight) * 0.34));
}

function layoutRing(){
  var R = orbitRadius();
  orbitRing.style.width = (R * 2) + 'px';
  orbitRing.style.height = (R * 1.05 * 2) + 'px';
  orbitRing.style.marginLeft = -R + 'px';
  orbitRing.style.marginTop = -(R * 1.05) + 'px';
}

function positionOrbit(){
  var cx = window.innerWidth / 2;
  var cy = window.innerHeight / 2;
  var R = orbitRadius();
  orbitItems.forEach(function(item){
    var angleRad = (item.baseAngle + angleOffset) * Math.PI / 180;
    var r = R * item.radiusFactor;
    var x = cx + Math.cos(angleRad) * r;
    var y = cy + Math.sin(angleRad) * r * 0.55; // órbita achatada, efecto de perspectiva
    var depth = (Math.sin(angleRad) + 1) / 2;   // 0 = fondo, 1 = frente
    item.el.style.left = x + 'px';
    item.el.style.top = y + 'px';
    item.el.style.setProperty('--depth', (0.72 + depth * 0.4).toFixed(2));
    item.el.style.opacity = (0.55 + depth * 0.45).toFixed(2);
    item.el.style.zIndex = String(Math.round(depth * 100) + 3);
  });
}

function hideHint(){
  if (hintHidden) return;
  hintHidden = true;
  hintPill.classList.add('hide');
}

function spinLoop(){
  angleOffset += AUTOSPIN;
  positionOrbit();
  requestAnimationFrame(spinLoop);
}

stage.addEventListener('pointerdown', function(e){
  dragging = true;
  stage.classList.add('dragging');
  dragStartX = e.clientX;
  angleStart = angleOffset;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', function(e){
  if (!dragging) return;
  angleOffset = angleStart + (e.clientX - dragStartX) * 0.28;
  if (Math.abs(e.clientX - dragStartX) > 6) hideHint();
});
function endDrag(){
  dragging = false;
  stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

stage.addEventListener('wheel', function(e){
  var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  angleOffset += delta * 0.12;
  hideHint();
  e.preventDefault();
}, { passive: false });

panLeftBtn.addEventListener('click', function(){ angleOffset -= 28; hideHint(); });
panRightBtn.addEventListener('click', function(){ angleOffset += 28; hideHint(); });

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight'){ angleOffset += 20; hideHint(); }
  if (e.key === 'ArrowLeft'){ angleOffset -= 20; hideHint(); }
});

window.addEventListener('resize', layoutRing);
layoutRing();
positionOrbit();
requestAnimationFrame(spinLoop);

/* =========================================================
   MÓDULO 5 — modal: abrir/cerrar carta + carta especial del centro
   ========================================================= */
var overlay = document.getElementById('modal-overlay');
var modalTitle = document.getElementById('modal-title');
var modalText = document.getElementById('modal-text');
var modalBouquet = document.getElementById('modal-bouquet');
var cornerFlowers = document.querySelectorAll('.corner-flower');

cornerFlowers.forEach(function(el){ fillCornerFlower(el); });

function typeText(el, text, speed, done){
  var i = 0;
  el.textContent = '';
  var caret = document.createElement('span');
  caret.className = 'modal-caret';
  el.appendChild(caret);
  var timer = setInterval(function(){
    if (i >= text.length){
      clearInterval(timer);
      if (caret.parentNode) caret.parentNode.removeChild(caret);
      if (done) done();
      return;
    }
    el.insertBefore(document.createTextNode(text[i]), caret);
    i++;
  }, speed);
}

function openModal(cluster){
  modalTitle.textContent = cluster.hero ? 'Mi amor…' : cluster.label;
  overlay.classList.add('active');

  if (cluster.hero){
    modalBouquet.hidden = false;
    if (!modalBouquet.dataset.built){
      modalBouquet.appendChild(buildBouquet('modal-hero'));
      modalBouquet.dataset.built = '1';
    }
    typeText(modalText, cluster.text, REDUCE ? 4 : 15);
  } else {
    modalBouquet.hidden = true;
    modalText.textContent = cluster.text;
  }
}
function closeModal(){
  overlay.classList.remove('active');
}
document.getElementById('modal-close-x').addEventListener('click', closeModal);
document.getElementById('modal-close-btn').addEventListener('click', closeModal);
overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && overlay.classList.contains('active')) closeModal();
});

/* =========================================================
   MÓDULO 6 — intro de hiperespacio
   ========================================================= */
(function intro(){
  var introEl = document.getElementById('intro');
  var canvas = document.getElementById('warp-canvas');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var cx = W / 2, cy = H / 2;
  var streaks = [];
  var n = REDUCE ? 0 : 140;
  for (var i = 0; i < n; i++){
    var angle = Math.random() * Math.PI * 2;
    streaks.push({
      angle: angle,
      dist: Math.random() * 60,
      speed: 4 + Math.random() * 9,
      len: 10 + Math.random() * 30
    });
  }
  var start = null;
  function frame(t){
    if (!start) start = t;
    var elapsed = t - start;
    ctx.fillStyle = 'rgba(2,6,23,0.35)';
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < streaks.length; i++){
      var s = streaks[i];
      s.dist += s.speed;
      var x1 = cx + Math.cos(s.angle) * s.dist;
      var y1 = cy + Math.sin(s.angle) * s.dist;
      var x2 = cx + Math.cos(s.angle) * (s.dist + s.len);
      var y2 = cy + Math.sin(s.angle) * (s.dist + s.len);
      ctx.strokeStyle = 'rgba(250,224,138,0.85)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      if (s.dist > Math.max(W, H)){
        s.dist = Math.random() * 40;
        s.angle = Math.random() * Math.PI * 2;
      }
    }
    if (elapsed < 1900 && !REDUCE) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(function(){
    introEl.classList.add('fade-out');
    setTimeout(function(){ introEl.remove(); }, 950);
  }, REDUCE ? 300 : 2000);
})();

setTimeout(function(){ if (!hintHidden) hintPill.classList.remove('hide'); }, 2200);
</script>
